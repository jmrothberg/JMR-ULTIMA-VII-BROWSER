<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090806">
    <title>JMR’S Ultima VII</title>
    <meta name="description" content="Play JMR’S Ultima VII: The Black Gate and Forge of Virtue in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="JMR’S Ultima VII">
    <meta property="og:description" content="The Black Gate and Forge of Virtue—play the original game in your browser.">
    <meta property="og:url" content="https://jmrothberg.github.io/JMR-ULTIMA-VII-BROWSER/dist/">
    <meta property="og:image" content="https://jmrothberg.github.io/JMR-ULTIMA-VII-BROWSER/dist/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="JMR’S Ultima VII">
    <meta name="twitter:description" content="The Black Gate and Forge of Virtue—play the original game in your browser.">
    <meta name="twitter:image" content="https://jmrothberg.github.io/JMR-ULTIMA-VII-BROWSER/dist/og.jpg">
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
    <link rel="stylesheet" href="./styles.css?v=mobile-2">
    <style>
      .dos-host .soft-keyboard { flex-shrink:0; max-height:65%; overflow:auto; margin:4px; touch-action:manipulation; }
      .dos-host .soft-keyboard .kbd { font-size:clamp(11px,2.7vw,16px); min-width:20px; padding:3px; }
      .dos-host .soft-keyboard .gap-2 { gap:3px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <div>
          <p class="eyebrow">JMR’S</p>
          <h1>Ultima VII: The Black Gate</h1>
        </div>
        <div class="actions">
          <span id="save-state" class="save-state">Saves remain on this device</span>
          <button id="fullscreen" class="icon-button" type="button" disabled>Expand</button>
        </div>
      </header>

      <section class="stage" aria-label="Ultima VII game">
        <div id="dos" class="dos-host"></div>
        <div id="gate" class="gate">
          <div class="sigil" aria-hidden="true">VII</div>
          <h2>Enter Britannia</h2>
          <p>The original 1992 game with Forge of Virtue.</p>
          <button id="start" class="start-button" type="button">Play</button>
          <div id="progress" class="progress" hidden>
            <div class="progress-track"><span id="progress-bar"></span></div>
            <p id="status" role="status">Preparing Britannia…</p>
          </div>
        </div>
      </section>

      <section id="touch-controls" class="touch-controls" aria-label="Game controls" hidden>
        <button type="button" data-touch-button="0" aria-pressed="true">Use / Talk</button>
        <button type="button" data-touch-button="1" aria-pressed="false">Walk</button>
        <button type="button" id="native-keyboard">iPhone / iPad Keyboard</button>
        <button type="button" data-game-key="257">Enter</button>
        <button type="button" data-game-key="256">Esc / Skip</button>
        <button type="button" data-game-key="73">Inventory</button>
        <button type="button" data-game-key="32">Combat</button>
      </section>
      <form id="typing-form" hidden style="padding:12px;border:1px solid #916b27">
        <label for="typing-input">Type a name or answer, then Send</label>
        <input id="typing-input" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="display:block;width:100%;font-size:18px;padding:12px;margin:8px 0;color:#fff;background:#241a0d;border:1px solid #916b27">
        <button type="submit" class="icon-button">Send + Enter</button>
        <button type="button" id="close-typing" class="icon-button">Close keyboard</button>
      </form>
      <p id="game-hint" class="game-hint" role="status">Made for touch. The keyboard icon opens an on-screen keyboard.</p>
      <footer>
        <span>Touch controls • Rotate for a larger view</span>
        <span>Ctrl+F11 / Ctrl+F12 adjusts game speed</span>
      </footer>
    </main>
    <script src="https://v8.js-dos.com/latest/emulators/emulators.js"></script>
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <script src="./app.js?v=keyboard-3"></script>
  </body>
</html>
